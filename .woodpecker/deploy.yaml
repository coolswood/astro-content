# deploy — деплой статики astro-content на оба контура (selfhost с 2026-10-22).
# Сборка на боксе (node 24 + pnpm, локфайл pnpm — bun.lock в репо игнорируется)
# → build-info.json + sha256-манифест → rsync на global (netcup, публичный IPv4)
# → verify манифеста → атомарный swap current → то же на RU (ТОЛЬКО tailnet
# 100.100.213.68: публичный IPv4 бокс→РФ деградирован — rsync по нему падает)
# → очистка старых релизов (хранить 3) → проверка build-info на обоих контурах.
#
# Оба контура и очистка — одной критической секцией локального flock агента
# (пайплайны исполняются на одном боксе): параллельные прогоны не могут
# перемешать порядок переключений и разъехать контуры, а cleanup чужого
# прогона не удаляет готовящийся релиз. Релиз кладётся в уникальный каталог
# <sha>.<timestamp> и активируется после проверки манифеста — каталог под
# current никогда не перезаписывается rsync (review PR#35).
#
# Раздача: caddy `handle @content` из /srv/content/current (Caddyfile/compose
# на хостах; раскладка и откат — /srv/mindhealth/DEPLOY.md на global и
# /srv/content/README.md на обоих). Секретов НЕ требует: SSH-ключи хостовые
# (~/.ssh/mh_global_deploy, ~/infra/github-runner/.ssh/vps_ru_deploy), rsync
# установлен на обоих хостах; HOME агента возвращаем первым действием
# (isolated-home v3.18).
#
# Триггеры: push в main (авто) + manual (ручной прогон/переdepлой ветки).
# build-info.json в dist — контракт мониторинга синхронности контуров.
# ⚠️ Доллар-фигурные подстановки в commands не использовать — Woodpecker
# подставляет их в YAML до запуска (drone/envsubst).

when:
  - event: push
    branch: main
  - event: manual

skip_clone: true
labels:
  backend: local
  lane: services

steps:
  # Сборка чекаутом точного SHA события (fetch по SHA разрешён на Forgejo):
  # образы/контент обязаны соответствовать коммиту, а не «текущему main».
  - name: build
    image: bash
    environment:
      PATH: /home/coolswood/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    commands:
      - |
        export HOME=/home/coolswood
        set -euo pipefail
        SHA=$(printenv CI_COMMIT_SHA || true)
        URL=https://gx10-7e45.tail5a1858.ts.net:3011/coolswood/astro-content.git
        git init -q .
        git remote add origin "$URL"
        if [ -n "$SHA" ]; then
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
        else
          BRANCH=$(printenv CI_COMMIT_BRANCH || true)
          [ -n "$BRANCH" ] || BRANCH=main
          git fetch -q --depth 1 origin "$BRANCH"
          git checkout -q FETCH_HEAD
          SHA=$(git rev-parse HEAD)
        fi
        printf '%s' "$SHA" > .deploy-sha
        # strict-dep-builds: pnpm 12 в CI (CI=true) падает на проигнорированных
        # postinstall esbuild/sharp; бинарники приходят optionalDependencies,
        # скрипты не нужны (детерминизм вывода сверен с Vercel байт-в-байт).
        pnpm install --frozen-lockfile --config.strict-dep-builds=false
        pnpm build
        printf '{"sha":"%s","builtAt":"%s","repo":"astro-content","trigger":"ci"}\n' \
          "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
        (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > dist.manifest
        echo "built $SHA: $(wc -l < dist.manifest) files, $(du -sh dist | cut -f1)"

  # Оба контура одним шагом под локальным flock бокса: секция «global → RU»
  # одного прогона не перемешивается с чужим прогоном (global A → global B →
  # RU B → RU A оставляла контуры на разных SHA; verify лишь рапортовал об
  # ошибке) — review PR#35. Каталог релиза уникален на сборку (RID = SHA +
  # таймстемп): rsync --delete в releases/$SHA при повторном деплое активного
  # SHA переписывал бы ЖИВОЙ релиз до проверки манифеста — смесь файлов у
  # пользователей, полуобновлённый current при обрыве передачи — review PR#35.
  - name: deploy
    image: bash
    commands:
      - |
        export HOME=/home/coolswood
        set -euo pipefail
        SHA=$(cat .deploy-sha)
        RID="$SHA.$(date -u +%Y%m%dT%H%M%SZ)"
        mkdir -p /home/coolswood/.cache
        exec 8>/home/coolswood/.cache/astro-content-deploy.lock
        flock -x -w 900 8

        # Порядок контуров: global первым (камень дивергенции из задачи переезда).
        KEY=/home/coolswood/.ssh/mh_global_deploy
        RSYNC_RSH="ssh -i $KEY -o BatchMode=yes"
        rsync -a --delete -e "$RSYNC_RSH" dist/ root@89.58.1.204:/srv/content/releases/$RID/
        rsync -a -e "$RSYNC_RSH" dist.manifest root@89.58.1.204:/srv/content/manifests/$RID.manifest
        ssh -i "$KEY" -o BatchMode=yes root@89.58.1.204 bash -s -- "$RID" <<'REMOTE'
          set -euo pipefail
          RID=$1
          # проверка манифеста И свитч под одним хостовым lock: cleanup не
          # может втиснуться между проверкой и активацией и оставить current
          # ссылкой на удалённый каталог (review PR#35)
          exec 9>/srv/content/.switch.lock
          flock -x -w 300 9
          cd /srv/content/releases/$RID
          sha256sum -c /srv/content/manifests/$RID.manifest --quiet
          # абсолютные пути: скрипт стоит ВНУТРИ релиза, относительный current
          # создался бы в каталоге релиза, а настоящий /srv/content/current
          # остался бы на старом sha (поймано репетицией 2026-10-22)
          NEXT=/srv/content/current.next.$(date +%s%N)
          ln -sfn releases/$RID "$NEXT"
          mv -T "$NEXT" /srv/content/current
          echo "GLOBAL_SWAPPED $RID"
        REMOTE

        # RU — только tailnet-IP: публичный IPv4 бокс→РФ теряет крупные пакеты
        KEY=/home/coolswood/infra/github-runner/.ssh/vps_ru_deploy
        RSYNC_RSH="ssh -i $KEY -o BatchMode=yes"
        rsync -a --delete -e "$RSYNC_RSH" dist/ root@100.100.213.68:/srv/content/releases/$RID/
        rsync -a -e "$RSYNC_RSH" dist.manifest root@100.100.213.68:/srv/content/manifests/$RID.manifest
        ssh -i "$KEY" -o BatchMode=yes root@100.100.213.68 bash -s -- "$RID" <<'REMOTE'
          set -euo pipefail
          RID=$1
          # проверка манифеста И свитч под одним хостовым lock — как на global
          exec 9>/srv/content/.switch.lock
          flock -x -w 300 9
          cd /srv/content/releases/$RID
          sha256sum -c /srv/content/manifests/$RID.manifest --quiet
          NEXT=/srv/content/current.next.$(date +%s%N)
          ln -sfn releases/$RID "$NEXT"
          mv -T "$NEXT" /srv/content/current
          echo "RU_SWAPPED $RID"
        REMOTE

  # Очистка: 3 свежих релиза на хост (по mtime), манифесты — вслед им.
  - name: cleanup
    image: bash
    commands:
      - |
        export HOME=/home/coolswood
        set -euo pipefail
        # тот же локальный lock, что и deploy: cleanup параллельного прогона
        # не удаляет релиз, который другой прогон ещё загружает или уже
        # проверил, но не активировал (review PR#35); активный релиз сверх
        # того защищён на хосте под .switch.lock
        mkdir -p /home/coolswood/.cache
        exec 8>/home/coolswood/.cache/astro-content-deploy.lock
        flock -x -w 900 8
        ssh -i /home/coolswood/.ssh/mh_global_deploy -o BatchMode=yes root@89.58.1.204 <<'REMOTE'
          set -euo pipefail
          # prune under the same lock as the swap and never delete the release
          # `current` points to: rsync -a preserves build-time mtimes, so with
          # parallel or re-deploys the active release may be the oldest by
          # mtime and would be pruned, leaving current dangling (review PR#35)
          exec 9>/srv/content/.switch.lock
          flock -x -w 300 9
          cd /srv/content/releases
          ACTIVE=$(basename "$(readlink /srv/content/current 2>/dev/null)")
          ls -1dt */ 2>/dev/null | tail -n +4 | while read -r d; do
            [ "$d" = "$ACTIVE/" ] || rm -rf -- "$d"
          done
          cd ../manifests
          for m in *.manifest; do
            [ -e "$m" ] || break
            [ -d "../releases/$${m%.manifest}" ] || rm -f -- "$m"
          done
        REMOTE
        ssh -i /home/coolswood/infra/github-runner/.ssh/vps_ru_deploy -o BatchMode=yes root@100.100.213.68 <<'REMOTE'
          set -euo pipefail
          # prune under the same lock as the swap and never delete the release
          # `current` points to: rsync -a preserves build-time mtimes, so with
          # parallel or re-deploys the active release may be the oldest by
          # mtime and would be pruned, leaving current dangling (review PR#35)
          exec 9>/srv/content/.switch.lock
          flock -x -w 300 9
          cd /srv/content/releases
          ACTIVE=$(basename "$(readlink /srv/content/current 2>/dev/null)")
          ls -1dt */ 2>/dev/null | tail -n +4 | while read -r d; do
            [ "$d" = "$ACTIVE/" ] || rm -rf -- "$d"
          done
          cd ../manifests
          for m in *.manifest; do
            [ -e "$m" ] || break
            [ -d "../releases/$${m%.manifest}" ] || rm -f -- "$m"
          done
        REMOTE
        echo CLEANUP_OK

  # Живая проверка: build-info на обоих контурах отвечает собранным SHA.
  # RU проверяем по tailnet :80 (публичный путь бокс→РФ деградирован).
  - name: verify
    image: bash
    commands:
      - |
        set -euo pipefail
        SHA=$(cat .deploy-sha)
        g=$(curl -fsS https://server.mind-health.xyz/build-info.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
        r=$(curl -fsS http://100.100.213.68/build-info.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
        echo "global=$g ru=$r expected=$SHA"
        # явный if: `a && b` под set -e не прерывает сценарий при ложном первом операнде
        if [ "$g" != "$SHA" ] || [ "$r" != "$SHA" ]; then
          echo "VERIFY_MISMATCH"
          exit 1
        fi
        echo VERIFY_OK
